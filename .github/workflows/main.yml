name: Build Voxali APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Voxali.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Voxali-APK
          path: release/Voxali.apk
